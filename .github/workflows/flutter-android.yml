name: ManhwaKu Flutter Android
on:
  push:
    branches: ["main"]
    paths: ["flutter_app/**", ".github/workflows/flutter-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.manhwaku --project-name reader .
      - name: Set app name and Internet permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="ManhwaKu"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          GRADLE_FILE="android/app/build.gradle.kts"
          if grep -q 'minSdk = flutter.minSdkVersion' "$GRADLE_FILE"; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 29/' "$GRADLE_FILE"
          else
            echo "Unable to enforce Android 10 (minSdk 29) in generated Gradle file."
            grep -n 'minSdk\|defaultConfig' "$GRADLE_FILE" || true
            exit 1
          fi
          grep -n 'manifest\|android.permission.INTERNET\|android:label' "$MANIFEST"
          grep -n 'applicationId\|minSdk\|targetSdk' "$GRADLE_FILE"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build ARM release APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaKu-v2.9.1-android-arm-apks
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

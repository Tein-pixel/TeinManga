name: ManhwaKu Flutter Android
on:
  push:
    branches: ["main"]
    paths: ["flutter_app/**", ".github/workflows/flutter-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.manhwaku --project-name reader .
      - name: Set app name and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          label = 'android:label="'
          start = content.find(label)
          if start >= 0:
              end = content.find('"', start + len(label))
              if end >= 0:
                  content = content[:start] + 'android:label="ManhwaKu"' + content[end + 1:]
          if 'android.permission.INTERNET' not in content:
              manifest_start = content.find('<manifest')
              manifest_end = content.find('>', manifest_start)
              if manifest_start < 0 or manifest_end < 0:
                  raise RuntimeError("AndroidManifest.xml manifest tag missing")
              content = content[:manifest_end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + content[manifest_end + 1:]
          path.write_text(content)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaKu-online-reader-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
